<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Memory</title>
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    // No stored preference = follow the system, handled purely by CSS media queries.
    (function () {
      try {
        const stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-controls">
    <a id="download-all" class="icon-btn secondary-btn" href="/api/download-all" aria-disabled="true">
      <span class="icon-btn-icon">⬇</span><span class="icon-btn-label">Download all</span>
    </a>
    <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Toggle dark/light theme">
      <span class="icon-btn-icon"></span><span class="icon-btn-label"></span>
    </button>
  </div>

  <header class="page-header">
    <h1 id="trip-title">Travel Memory</h1>
    <p class="subtitle">Add a photo, a few words, or both — everyone's contributions build the timeline below.</p>
  </header>

  <main>
    <section class="upload-card">
      <form id="entry-form">
        <div class="field-row">
          <input type="text" id="name" name="name" placeholder="Your name (optional)" maxlength="60" />
        </div>
        <div class="field-row">
          <textarea id="caption" name="caption" placeholder="Say something about this moment..." maxlength="500" rows="2"></textarea>
        </div>
        <div class="field-row file-row">
          <label class="file-label" for="image">
            <span id="file-label-text">📷 Add a photo (optional)</span>
            <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/webp" />
          </label>
          <button type="submit" id="submit-btn">Add to timeline</button>
        </div>
        <p id="form-status" class="status" role="status"></p>
      </form>
    </section>

    <section id="timeline" class="timeline">
      <p class="empty-state" id="empty-state">Loading timeline…</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
